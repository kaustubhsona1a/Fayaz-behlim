  <body class="bg-[#050507] text-zinc-200 antialiased selection:bg-white selection:text-black overflow-x-hidden">
    <script type="text/javascript">
      // Decode deep-links redirected through 404.html on static hosts / GitHub Pages
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&'); 
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
